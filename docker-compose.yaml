services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Evaluation
      - MSSQL_MEMORY_LIMIT_MB=1024
    ports:
      - 777:1433
    volumes:
      - sqlserver-data:/var/opt/mssql
      - "./sauvegarde/:/sauvegarde/"
volumes:
  sqlserver-data: